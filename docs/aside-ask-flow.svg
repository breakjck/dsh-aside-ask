<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-label="旁问流程：在主对话里选中一段，右键开出旁支窗口；答完可以在同一窗口继续追问，答案会在你下次开口时作为折叠记录带回主对话">
  <defs>
    <marker id="aside-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B6EF6"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="390" rx="16" fill="#FFFFFF" stroke="#E3E8F2"/>

  <!-- 主对话 -->
  <text class="label" x="30" y="76" font-size="14" font-weight="600" fill="#1F2328">主对话</text>
  <line x1="104" y1="71" x2="838" y2="71" stroke="#CBD3E1" stroke-width="2" stroke-linecap="round"/>

  <!-- 选中一段 -->
  <circle cx="318" cy="71" r="7" fill="#3B6EF6"/>
  <circle cx="318" cy="71" r="12" fill="none" stroke="#3B6EF6" stroke-opacity="0.25" stroke-width="2"/>
  <text class="label" x="306" y="110" font-size="13" fill="#4A5260" text-anchor="end">选中一段</text>

  <!-- 下次开口时回流 -->
  <circle cx="700" cy="71" r="6" fill="#FFFFFF" stroke="#3B6EF6" stroke-width="2"/>
  <text class="label" x="700" y="48" font-size="12.5" fill="#4A5260" text-anchor="middle">下次开口时带上一条折叠记录</text>

  <!-- 下：右键开窗 -->
  <path d="M318 88 V 146" stroke="#3B6EF6" stroke-width="1.6" fill="none" marker-end="url(#aside-arrow)"/>
  <text class="label" x="330" y="126" font-size="12" fill="#6B7280">右键</text>

  <!-- 上：答案回流 -->
  <path d="M560 146 V 88" stroke="#3B6EF6" stroke-width="1.6" fill="none" marker-end="url(#aside-arrow)"/>
  <text class="label" x="572" y="126" font-size="12" fill="#6B7280">答案作为上下文回流</text>

  <!-- 旁问窗口 -->
  <rect x="196" y="148" width="470" height="196" rx="14" fill="#F8FAFF" stroke="#D6E0F5"/>
  <text class="label" x="216" y="174" font-size="13" font-weight="600" fill="#1F2328">⠿ 旁问</text>
  <text class="label" x="646" y="174" font-size="11.5" fill="#8A93A6" text-anchor="end">同一窗口可继续追问</text>
  <line x1="196" y1="186" x2="666" y2="186" stroke="#E3E8F2"/>

  <rect x="212" y="198" width="224" height="26" rx="6" fill="#EDF2FB"/>
  <text class="label" x="222" y="216" font-size="12" fill="#4A5260">「圈出的那段话」</text>

  <text class="label" x="212" y="248" font-size="12.5" font-weight="600" fill="#1F2328">问：这句话到底是什么意思？</text>
  <text class="label" x="212" y="272" font-size="12" fill="#55607A">答：它指的是旁支子对话给出的那段解释。</text>

  <rect x="212" y="292" width="408" height="30" rx="7" fill="#FFFFFF" stroke="#D6E0F5"/>
  <text class="label" x="222" y="312" font-size="11.5" fill="#8A93A6">接着问…   Ctrl+Enter 发送</text>
  <rect x="630" y="297" width="22" height="20" rx="6" fill="#3B6EF6"/>
  <text class="label" x="641" y="311" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">问</text>

  <text class="label" x="30" y="372" font-size="11.5" fill="#8A93A6">旁支 = 一条 fork 子会话：不新增主对话轮次，也不唤醒空闲的主 agent；同一窗口里的追问按顺序累积。</text>
</svg>
